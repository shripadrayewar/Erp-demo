name: CI — Build & Push Docker Images

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build, Push & Update Tags
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated docker-compose.yml
      packages: write   # needed to push to ghcr.io

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use PAT or default GITHUB_TOKEN for the commit-back step
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Resolve image names (lowercase owner required by OCI) ────────────
      - name: Set image names
        id: images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${OWNER}/erp-demo-backend" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/${OWNER}/erp-demo-frontend" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)"          >> $GITHUB_OUTPUT

      # ── 3. Docker Buildx ────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Login to GHCR (push jobs only) ───────────────────────────────────
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Build & push backend ─────────────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.images.outputs.backend }}:${{ steps.images.outputs.sha }}
            ${{ steps.images.outputs.backend }}:latest
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      # ── 6. Build & push frontend ─────────────────────────────────────────────
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.sha }}
            ${{ steps.images.outputs.frontend }}:latest
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      # ── 7. Pin exact SHA tags in docker-compose.yml ──────────────────────────
      - name: Update image tags in docker-compose.yml
        if: github.event_name == 'push'
        run: |
          SHA="${{ steps.images.outputs.sha }}"
          BACKEND="${{ steps.images.outputs.backend }}"
          FRONTEND="${{ steps.images.outputs.frontend }}"

          sed -i "s|image: ${BACKEND}:.*|image: ${BACKEND}:${SHA}|g" docker-compose.yml
          sed -i "s|image: ${FRONTEND}:.*|image: ${FRONTEND}:${SHA}|g" docker-compose.yml

          echo "docker-compose.yml after update:"
          grep "image:" docker-compose.yml

      # ── 8. Commit updated docker-compose.yml back to the branch ─────────────
      - name: Commit updated docker-compose.yml
        if: github.event_name == 'push'
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          # Only commit if something changed; [skip ci] prevents re-triggering
          git diff --staged --quiet || \
            git commit -m "ci: pin image tags to ${{ steps.images.outputs.sha }} [skip ci]"
          git push
